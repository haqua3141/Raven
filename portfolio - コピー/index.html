<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Tap Battle Online</title>

    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js"></script>

    <style>
        body {
            margin: 0;
            background: radial-gradient(circle, #0f0f2a, #000);
            font-family: sans-serif;
            color: #0ff;
            text-align: center;
        }

        h1 {
            text-shadow: 0 0 20px #0ff;
        }

        #gameArea {
            margin: 20px auto;
            width: 90%;
            max-width: 600px;
            height: 150px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 32px;
            border: 2px solid #0ff;
            box-shadow: 0 0 20px #0ff;
            border-radius: 20px;
        }

        .players {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            max-width: 600px;
            margin: 20px auto;
        }

        .player {
            padding: 10px;
            border: 1px solid #0ff;
            border-radius: 10px;
        }

        button {
            padding: 10px;
            margin: 5px;
            background: #0ff;
            border: none;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>⚡ CYBER TAP ONLINE ⚡</h1>

    <input id="roomInput" placeholder="ルームID">
    <button onclick="joinRoom()">参加</button>

    <div id="gameArea">WAITING...</div>

    <div class="players">
        <div class="player" id="p1">P1:0</div>
        <div class="player" id="p2">P2:0</div>
        <div class="player" id="p3">P3:0</div>
        <div class="player" id="p4">P4:0</div>
    </div>

    <button onclick="startRound()">START</button>

    <div class="players">
        <button onclick="tap(1)">P1</button>
        <button onclick="tap(2)">P2</button>
        <button onclick="tap(3)">P3</button>
        <button onclick="tap(4)">P4</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, doc, setDoc, onSnapshot, updateDoc } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCn--7WZTTORtEkdrZrKwUriN5p_-sD2hw",
            authDomain: "test-5744b.firebaseapp.com",
            projectId: "test-5744b",
            storageBucket: "test-5744b.firebasestorage.app",
            messagingSenderId: "850598501026",
            appId: "1:850598501026:web:f511a318a0d546ff82d5fb",
            measurementId: "G-1QF8G8HEFK"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let roomId = null;
        let state = "waiting";

        window.joinRoom = async function () {
            roomId = document.getElementById("roomInput").value;
            const roomRef = doc(db, "rooms", roomId);

            await setDoc(roomRef, {
                state: "waiting",
                scores: { 1: 0, 2: 0, 3: 0, 4: 0 }
            }, { merge: true });

            onSnapshot(roomRef, (docSnap) => {
                const data = docSnap.data();
                if (!data) return;
                state = data.state;
                document.getElementById("gameArea").innerText = data.state.toUpperCase();
                updateScore(data.scores);
            });
        };

        window.startRound = async function () {
            const roomRef = doc(db, "rooms", roomId);
            await updateDoc(roomRef, { state: "waiting" });
            setTimeout(async () => {
                await updateDoc(roomRef, { state: "tap" });
            }, Math.random() * 3000 + 2000);
        };

        window.tap = async function (player) {
            if (state !== "tap") return;
            const roomRef = doc(db, "rooms", roomId);
            await updateDoc(roomRef, {
                state: "end",
                ["scores." + player]: firebase.firestore.FieldValue.increment(1)
            });
        };

        function updateScore(scores) {
            for (let i = 1; i <= 4; i++) {
                document.getElementById("p" + i).innerText = "P" + i + ":" + scores[i];
            }
        }
    </script>

</body>

</html>

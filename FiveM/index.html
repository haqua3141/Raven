<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        クラフトレシピ管理
    </title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- =====================================================
       ヘッダー
  ====================================================== -->

    <header class="site-header">

        <div class="header-inner">


            <div class="site-title">

                <span class="site-icon">
                    ⚒️
                </span>


                <div>

                    <h1>
                        クラフトレシピ管理
                    </h1>

                    <p>
                        CRAFT RECIPE DATABASE
                    </p>

                </div>

            </div>


            <button id="menuButton" class="menu-button" type="button" aria-label="メニューを開く">
                ☰
            </button>

        </div>

    </header>



    <!-- =====================================================
       サイドバー
  ====================================================== -->

    <aside id="sidebar" class="sidebar">

        <nav class="sidebar-nav">


            <button class="nav-item active" type="button" data-category="all">

                <span>
                    📋
                </span>

                <span>
                    すべて
                </span>

            </button>


            <button class="nav-item" type="button" data-category="weapon">

                <span>
                    🔫
                </span>

                <span>
                    武器クラフト
                </span>

            </button>


            <button class="nav-item" type="button" data-category="handicraft">

                <span>
                    🧵
                </span>

                <span>
                    手芸クラフト
                </span>

            </button>


            <button class="nav-item" type="button" data-category="special">

                <span>
                    🧪
                </span>

                <span>
                    特殊クラフト
                </span>

            </button>


            <button class="nav-item" type="button" data-category="food">

                <span>
                    🍔
                </span>

                <span>
                    飲食クラフト
                </span>

            </button>


        </nav>

    </aside>



    <!-- スマホ用背景 -->

    <div id="sidebarOverlay" class="sidebar-overlay"></div>



    <!-- =====================================================
       メイン
  ====================================================== -->

    <main class="main-content">


        <!-- ===================================================
         ページタイトル
    ==================================================== -->

        <section class="page-heading">

            <div>

                <p class="page-label">
                    CRAFT DATABASE
                </p>

                <h2 id="categoryTitle">
                    すべてのクラフト
                </h2>

                <p id="categoryDescription">
                    登録されているクラフトレシピから
                    必要な素材数を確認できます。
                </p>

            </div>

        </section>



        <!-- ===================================================
         検索・フィルター
    ==================================================== -->

        <section class="control-panel">


            <!-- 検索 -->

            <div class="search-box">

                <span class="search-icon">
                    🔍
                </span>

                <input id="searchInput" type="search" placeholder="クラフト名・素材名・場所で検索" autocomplete="off">

            </div>



            <!-- 操作 -->

            <div class="control-actions">


                <select id="categorySelect" aria-label="カテゴリー">

                    <option value="all">
                        すべて
                    </option>

                    <option value="weapon">
                        武器クラフト
                    </option>

                    <option value="handicraft">
                        手芸クラフト
                    </option>

                    <option value="special">
                        特殊クラフト
                    </option>

                    <option value="food">
                        飲食クラフト
                    </option>

                </select>


                <select id="sortSelect" aria-label="並び順">

                    <option value="default">
                        標準
                    </option>

                    <option value="nameAsc">
                        名前順 A → Z
                    </option>

                    <option value="nameDesc">
                        名前順 Z → A
                    </option>

                </select>


            </div>

        </section>



        <!-- ===================================================
         件数
    ==================================================== -->

        <section class="result-info">

            <p>

                <strong id="recipeCount">
                    0
                </strong>

                件のクラフトレシピ

            </p>

        </section>



        <!-- ===================================================
         レシピ一覧
    ==================================================== -->

        <section id="recipeGrid" class="recipe-grid" aria-live="polite">

            <!-- script.js で生成 -->

        </section>



        <!-- ===================================================
         検索結果なし
    ==================================================== -->

        <section id="emptyState" class="empty-state hidden">

            <div class="empty-icon">
                🔍
            </div>

            <h3>
                該当するクラフトがありません
            </h3>

            <p>
                検索条件やカテゴリーを変更してください。
            </p>

        </section>


    </main>



    <!-- =====================================================
       レシピ詳細モーダル
  ====================================================== -->

    <div id="recipeModal" class="modal" aria-hidden="true">


        <div class="modal-backdrop" data-close-modal></div>


        <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modalRecipeName">


            <!-- =================================================
           モーダルヘッダー
      ================================================== -->

            <div class="modal-header">

                <div>

                    <span id="modalCategory" class="category-badge">
                    </span>

                    <h2 id="modalRecipeName">
                        クラフト名
                    </h2>

                </div>


                <button class="modal-close" type="button" data-close-modal aria-label="閉じる">
                    ×
                </button>

            </div>



            <!-- =================================================
           モーダル本文
      ================================================== -->

            <div class="modal-body">


                <!-- ===============================================
             作成数
        ================================================ -->

                <section class="modal-section">

                    <div class="section-title-row">

                        <div>

                            <p class="section-label">
                                CRAFT AMOUNT
                            </p>

                            <h3>
                                作成数
                            </h3>

                        </div>

                    </div>


                    <div class="quantity-control">

                        <button id="quantityMinus" class="quantity-button" type="button" aria-label="作成数を1減らす">
                            −
                        </button>


                        <input id="craftQuantity" type="number" min="1" step="1" value="1" inputmode="numeric"
                            aria-label="作成数">


                        <button id="quantityPlus" class="quantity-button" type="button" aria-label="作成数を1増やす">
                            ＋
                        </button>

                    </div>

                </section>



                <!-- ===============================================
             必要素材
        ================================================ -->

                <section class="modal-section">

                    <div class="section-title-row">

                        <div>

                            <p class="section-label">
                                MATERIALS
                            </p>

                            <h3>
                                必要素材
                            </h3>

                        </div>


                        <span class="calculation-note">
                            作成数に応じて自動計算
                        </span>

                    </div>


                    <div class="material-table-wrap">

                        <table class="material-table">

                            <thead>

                                <tr>

                                    <th>
                                        素材
                                    </th>

                                    <th>
                                        1回
                                    </th>

                                    <th>
                                        必要数
                                    </th>

                                </tr>

                            </thead>


                            <tbody id="materialList">

                                <!-- script.js で生成 -->

                            </tbody>

                        </table>

                    </div>

                </section>



                <!-- ===============================================
             クラフト場所
        ================================================ -->

                <section class="modal-section">

                    <div class="section-title-row">

                        <div>

                            <p class="section-label">
                                LOCATIONS
                            </p>

                            <h3>
                                クラフト場所
                            </h3>

                        </div>

                    </div>


                    <div id="locationList" class="location-list">

                        <!-- script.js で生成 -->

                    </div>

                </section>



                <!-- ===============================================
             備考
        ================================================ -->

                <section id="notesSection" class="modal-section">

                    <div class="section-title-row">

                        <div>

                            <p class="section-label">
                                NOTES
                            </p>

                            <h3>
                                備考
                            </h3>

                        </div>

                    </div>


                    <div id="modalNotes" class="notes-box">
                    </div>

                </section>


            </div>

        </div>

    </div>



    <!-- =====================================================
       画像拡大モーダル
  ====================================================== -->

    <div id="imageModal" class="image-modal" aria-hidden="true">


        <div class="image-modal-backdrop" data-close-image></div>


        <div class="image-modal-content">


            <button class="image-modal-close" type="button" data-close-image aria-label="画像を閉じる">
                ×
            </button>


            <img id="enlargedImage" src="" alt="">


            <p id="enlargedImageCaption">
            </p>


        </div>

    </div>



    <!-- =====================================================
       フッター
  ====================================================== -->

    <footer class="site-footer">

        <p>
            Craft Recipe Database
        </p>

        <p class="footer-sub">
            クラフト内容は管理ページから変更できます。
        </p>

    </footer>



    <!-- =====================================================
       JavaScript

       必ず data.js → script.js の順番
  ====================================================== -->

    <!-- Supabase公式JavaScriptライブラリ -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <!-- Supabase共通処理 -->
    <script src="supabase.js"></script>

    <!-- 閲覧ページ処理 -->
    <script src="script.js"></script>


</body>

</html>
